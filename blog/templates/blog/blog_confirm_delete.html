{% extends 'catalog/base.html' %}
{% block title %}Удаление поста{% endblock %}

{% block content %}
<h2>Удалить "{{ object.title }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
