{% extends 'catalog/base.html' %}
{% block content %}
<h1 class="text-center mt-4">Блог</h1>

<div class="row mt-4">
  {% for post in posts %}
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm">
        {% if post.preview %}
          <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}">
        {% endif %}
        <div class="card-body">
          <h5>{{ post.title }}</h5>
          <p>{{ post.content|truncatechars:100 }}</p>
          <a href="{% url 'blog_detail' post.pk %}" class="btn btn-primary">Читать</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>Пока нет постов.</p>
  {% endfor %}
</div>
{% endblock %}
